<section class="screen universe-morph-screen" aria-label="Universe morph teszt">
  <header class="top-bar compact">
    <button class="back-button" data-route="workspace-topic-connections" aria-label="Vissza">‹</button>
    <div><span class="eyebrow">DEVELOPER TEST</span><h2>Universe morph</h2></div>
  </header>
  <div class="screen-subheader universe-child-nav" data-screen-subheader aria-label="Universe nézetek">
    <div class="tabs">
      <button class="tab is-active" type="button" data-route="universe-morph-test" aria-current="page">Universe v1</button>
      <button class="tab" type="button" data-route="universe-morph-test-v2">Universe v2</button>
      <button class="tab" type="button" data-route="universe-morph-test-v3">Universe v3</button>
      <button class="tab" type="button" data-route="universe-morph-test-v4">Universe v4</button>
    </div>
  </div>
  <main class="universe-morph-test" data-universe-morph-test>
    <div class="universe-morph-stage" data-universe-stage>
      <div class="universe-morph-galaxy" data-universe-galaxy aria-label="3D Force Graph galaxis"></div>
      <div class="universe-morph-map" data-universe-map hidden aria-label="Lapos mock tudástérkép"></div>
      <div class="universe-morph-proxy" data-universe-proxy hidden></div>
      <button type="button" class="universe-fullscreen-toggle" data-universe-fullscreen aria-pressed="false" aria-label="Universe teljes képernyőre kapcsolása" title="Teljes képernyő">⛶</button>
      <section class="universe-corridor" data-universe-corridor hidden aria-label="Kapcsolati folyosó">
        <div class="universe-corridor-toolbar">
          <span><strong>2 bolygós nézet</strong><small>Kapcsolati folyosó</small></span>
          <button type="button" class="universe-corridor-close" data-universe-corridor-close aria-label="Vissza az egybolygós nézethez">×</button>
        </div>
      </section>
      <aside class="universe-morph-debug" data-universe-debug aria-label="Universe morph debug"></aside>
    </div>
  </main>
</section>

<section class="screen universe4-screen" aria-label="Universe V4 renderer handoff">
  <header class="top-bar compact">
    <button class="back-button" type="button" data-route="home" aria-label="Vissza a kezdőképernyőre">‹</button>
    <div><span class="eyebrow">DJINN UNIVERSE</span><h2>Universe</h2></div>
  </header>

  <main class="universe4-main" data-universe4-screen>
    <div class="universe4-stage-shell" data-universe4-stage-shell>
      <section class="universe4-viewport" data-universe4-viewport aria-label="Universe V4 render viewport" aria-busy="false">
        <div class="universe4-render-stage universe4-force-stage" data-universe4-force-stage aria-label="Inline 3D Force Graph render stage"></div>
        <div class="universe4-render-stage universe4-globe-stage" data-universe4-globe-stage aria-label="Standalone Globe render stage" aria-hidden="true"></div>
        <div class="universe4-render-stage universe4-morph-patch-stage" data-universe4-morph-patch-stage aria-hidden="true"></div>
        <div class="universe4-render-stage universe4-g6-stage" data-universe4-g6-stage aria-label="G6 Fókuszált térkép v2 render stage" aria-hidden="true"></div>
        <div class="universe4-v7-debug-portal" data-universe4-v7-debug-portal aria-label="Universe V7 Globe.gl diagnosztika"></div>
        <button type="button" class="universe4-fullscreen-toggle" data-universe4-fullscreen aria-pressed="false" aria-label="Universe teljes képernyőre kapcsolása" title="Teljes képernyő">⛶</button>
        <button type="button" class="universe4-reset-button" data-universe4-reset aria-label="Universe Force Graph alapállapotba állítása">↺ Reset</button>
        <div class="universe4-background-controls" role="group" aria-label="Renderer háttérszín teszt">
          <label>Force
            <select data-universe4-force-background aria-label="Force Graph háttérszíne">
              <option value="force" selected>ForceGraph · világosabb</option>
              <option value="globe">Globe.gl · sötétebb</option>
            </select>
          </label>
          <label>Globe
            <select data-universe4-globe-background aria-label="Globe.gl háttérszíne">
              <option value="force">ForceGraph · világosabb</option>
              <option value="globe" selected>Globe.gl · sötétebb</option>
            </select>
          </label>
        </div>

        <div class="universe4-stage-status" data-universe4-stage-status aria-live="polite">
          <span class="universe4-stage-status-dot" aria-hidden="true"></span>
          <output data-universe4-state>GALAXY_IDLE</output>
        </div>
      </section>

      <!-- include:partials/universe-debug.html -->
    </div>
  </main>
</section>

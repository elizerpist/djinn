<section class="screen knowledge-map-screen" aria-label="Légzési elégtelenség felfedezése">
  <header class="top-bar compact map-topic-header">
    <button class="back-button" data-route="workspace-topics" aria-label="Vissza a témákhoz">‹</button>
    <div class="map-topic-title"><span class="eyebrow">TÉMA · TUDÁSTÉR</span><h2>Légzési elégtelenség</h2></div>
    <div class="top-bar-actions">
      <button class="icon-button" data-map-action="toggle-topic-favorite" aria-label="Téma kedvencnek jelölése" aria-pressed="false">☆</button>
      <button class="icon-button" data-map-action="topic-menu" aria-label="Téma műveletek" aria-expanded="false">⋮</button>
    </div>
    <div class="map-overflow-menu" data-map-menu hidden>
      <button data-map-action="topic-edit">Téma szerkesztése</button>
      <button data-map-action="topic-share">Téma megosztása</button>
      <button data-map-action="topic-archive">Téma archiválása</button>
    </div>
  </header>

  <div class="screen-subheader map-screen-subheader" data-screen-subheader>
    <div class="composer map-search-composer" role="search">
      <div class="composer-shell">
        <span class="search-icon">⌕</span>
        <input data-map-search aria-label="Keresés a Légzési elégtelenség témában" autocomplete="off" placeholder="Keresés a témában…" />
        <button class="map-search-clear" data-map-action="clear-search" aria-label="Keresés törlése" hidden>×</button>
      </div>
      <div class="map-search-results" data-map-search-results role="listbox" hidden></div>
    </div>
    <div class="tabs topic-tabs" aria-label="Téma navigáció">
      <button class="tab" data-route="workspace-topic-overview">Áttekintés</button>
      <button class="tab" data-route="workspace-topic-notes">Jegyzetek</button>
      <button class="tab" data-route="workspace-topic-files">Források</button>
      <button class="tab is-active" data-route="workspace-topic-connections">Felfedezés</button>
      <button class="tab" data-route="workspace-topic-activity">Aktivitás</button>
    </div>
  </div>

  <!-- A G6 példatár-szerű layoutválasztóval működő teljes tudástérkép. -->
  <main class="knowledge-map" data-knowledge-map tabindex="-1" aria-label="Interaktív tudástérkép">
    <div class="map-pathbar">
      <nav class="map-breadcrumb" data-map-breadcrumb aria-label="Tudásútvonal"></nav>
      <button class="map-info-button" data-map-action="open-sheet" aria-label="A kiválasztott fogalom részletei">ⓘ</button>
    </div>
    <div class="map-canvas-wrap">
      <!-- A G6, a 3D Force Graph és a Globe.GL mindig csak az aktív nézetben rajzol. -->
      <div class="knowledge-map-g6" data-map-g6 tabindex="0" role="application" aria-label="Légzési elégtelenség interaktív tudástérképe"></div>
      <div class="knowledge-force-3d" data-map-force-3d tabindex="0" role="application" aria-label="Légzési elégtelenség háromdimenziós erőalapú gráfja" hidden></div>
      <div class="knowledge-force-3d knowledge-force-3d-sphere" data-map-force-3d-sphere tabindex="0" role="application" aria-label="Légzési elégtelenség gömbhéjon forgó háromdimenziós erőalapú gráfja" hidden></div>
      <div class="knowledge-globe" data-map-globe tabindex="0" role="application" aria-label="Légzési elégtelenség háromdimenziós gömbnézete" hidden></div>
      <div class="knowledge-globe knowledge-globe-static" data-map-globe-static tabindex="0" role="application" aria-label="Légzési elégtelenség árnyék nélküli, automatikusan forgó gömbnézete" hidden></div>
      <div class="knowledge-globe knowledge-globe-cards" data-map-globe-cards tabindex="0" role="application" aria-label="Légzési elégtelenség perspektivikus tudáskártyákkal megjelenített gömbnézete" hidden></div>
      <div class="knowledge-globe knowledge-globe-focused-cards" data-map-globe-focused-cards tabindex="0" role="application" aria-label="Légzési elégtelenség fókuszált, lusta tudáskártya-gömbnézete" hidden></div>
      <div class="knowledge-globe knowledge-globe-rolling-cards" data-map-globe-rolling-cards tabindex="0" role="application" aria-label="Légzési elégtelenség végtelen, gördülő tudáskártya-gömbnézete" hidden></div>
      <div class="knowledge-cytoscape" data-map-cytoscape tabindex="0" role="application" aria-label="Légzési elégtelenség Cytoscape gráfnézete" hidden></div>
      <div class="map-layout-picker">
        <button class="map-layout-trigger" data-map-action="toggle-layout-menu" aria-expanded="false" aria-controls="map-layout-menu" aria-label="Gráfmegjelenítés kiválasztása">
          <span>Megjelenítés</span><strong data-map-layout-current>Force</strong><i aria-hidden="true">⌄</i>
        </button>
        <div id="map-layout-menu" class="map-layout-menu" data-map-layout-menu role="menu" aria-label="Elérhető gráfmegjelenítések" hidden>
          <div data-map-layout-options></div>
        </div>
      </div>
      <div class="map-empty-state" data-map-empty hidden>
        <strong>Nincs megjeleníthető kapcsolat</strong>
        <span>Módosítsd a szűrőket, vagy állítsd vissza őket.</span>
        <button data-map-action="reset-filters">Szűrők visszaállítása</button>
      </div>
      <div class="map-controls" aria-label="Térkép vezérlők">
        <button data-map-action="zoom-in" aria-label="Nagyítás">＋</button>
        <button data-map-action="zoom-out" aria-label="Kicsinyítés">−</button>
        <button data-map-action="focus" aria-label="Aktuális fogalom fókuszba helyezése">◎</button>
      </div>
      <button class="map-history-back map-history-floating" data-map-action="history-back" aria-label="Vissza az előző fogalomhoz" disabled>‹</button>
      <button class="map-world-button" data-map-action="world" aria-label="A teljes tudástér áttekintése">◌</button>
      <button class="map-filter-button" data-map-action="filters" aria-label="Térkép szűrése">☷ <span>Szűrők</span></button>
      <div class="map-route-status" data-map-route-status hidden>
        <span>Útvonal kiemelve</span><button data-map-action="close-path">Bezárás</button>
      </div>
    </div>
  </main>

  <!-- Részlet-, szűrő-, Djinn- és jegyzetnézetek JavaScriptből töltődnek fel. -->
  <div class="map-layer" data-map-layer aria-live="polite"></div>
</section>

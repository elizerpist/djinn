name: Android native build

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Test strict backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  android-apk:
    name: Build debug APK
    needs: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK 29
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate ObjectBox model
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter app
        run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64 \
            --dart-define=DJINN_BUILD_SHA="$GITHUB_SHA" \
            --dart-define=DJINN_BUILD_REF="$GITHUB_REF_NAME" \
            --dart-define=DJINN_BUILD_RUN_ID="$GITHUB_RUN_ID"

      - name: Prepare debug APK release file
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-debug.apk build/release/djinn-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk "build/release/djinn-debug-${SHORT_SHA}.apk"
          rm -rf "$ANDROID_HOME/ndk/29.0.13113456"
          rm -rf "$HOME/.gradle/caches"
          rm -rf .gradle android/.gradle
          find build -mindepth 1 -maxdepth 1 ! -name release -exec rm -rf {} +
          df -h

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          LATEST_APK_NAME="djinn-debug.apk"
          SHA_APK_NAME="djinn-debug-${SHORT_SHA}.apk"
          LATEST_APK_PATH="build/release/${LATEST_APK_NAME}"
          SHA_APK_PATH="build/release/${SHA_APK_NAME}"
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force
          SHA_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/${SHA_APK_NAME}"
          LATEST_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/${LATEST_APK_NAME}"
          NOTES="Latest Djinn debug APK built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA}.

          Direct SHA APK link: ${SHA_APK_URL}
          Latest moving APK link: ${LATEST_APK_URL}"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete-asset debug-latest "$LATEST_APK_NAME" --yes >/dev/null 2>&1 || true
            gh release upload debug-latest "$LATEST_APK_PATH" "$SHA_APK_PATH" --clobber
            gh release edit debug-latest \
              --title "Latest Djinn debug APK" \
              --notes "$NOTES"
          else
            gh release create debug-latest "$LATEST_APK_PATH" "$SHA_APK_PATH" \
              --prerelease \
              --title "Latest Djinn debug APK" \
              --notes "$NOTES"
          fi
          echo "Direct SHA APK link: ${SHA_APK_URL}"
          echo "Direct moving APK link: ${LATEST_APK_URL}"

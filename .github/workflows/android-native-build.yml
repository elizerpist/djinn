name: Android native build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Test strict backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  android-apk:
    name: Build debug APK
    needs: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK 29
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13113456"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter app
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare debug APK release file
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-debug.apk build/release/djinn-debug.apk

      - name: Publish latest debug APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: build/release/djinn-debug.apk
          APK_NAME: djinn-debug.apk
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force
          NOTES="Latest Djinn debug APK built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA}."
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release delete-asset debug-latest "$APK_NAME" --yes >/dev/null 2>&1 || true
            gh release upload debug-latest "$APK_PATH" --clobber
            gh release edit debug-latest \
              --title "Latest Djinn debug APK" \
              --notes "$NOTES"
          else
            gh release create debug-latest "$APK_PATH" \
              --prerelease \
              --title "Latest Djinn debug APK" \
              --notes "$NOTES"
          fi
          echo "Direct APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/debug-latest/${APK_NAME}"

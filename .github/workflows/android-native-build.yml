name: Android native build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-tests:
    name: Test strict backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  android-apk:
    name: Build Android APKs
    needs: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJINN_RELEASE_BACKEND_URL: ${{ vars.DJINN_BACKEND_URL || 'https://example.invalid' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter app
        run: flutter test

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=DJINN_BACKEND_URL=$DJINN_RELEASE_BACKEND_URL

      - name: Build same-phone trial APK
        run: >-
          flutter build apk --debug
          --dart-define=DJINN_BACKEND_URL=http://127.0.0.1:8000

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: djinn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload trial APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: djinn-trial-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

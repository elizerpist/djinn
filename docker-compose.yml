services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: djinn-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    container_name: djinn-postgres
    environment:
      POSTGRES_DB: djinn
      POSTGRES_USER: djinn
      POSTGRES_PASSWORD: djinn_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:
